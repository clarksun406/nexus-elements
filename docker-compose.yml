services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexus
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - nexus-pg:/var/lib/postgresql/data

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      STORE: postgres
      DATABASE_URL: postgres://nexus:nexus@postgres:5432/nexus
      LOG_LEVEL: info
      NEXUS_PUBLISHABLE_KEY: pk_test_nexus_example_key
      NEXUS_SECRET_KEY: sk_test_change_me
      NEXUS_WEBHOOK_SECRET: whsec_change_me
      NEXUS_ACCOUNT_ID: acct_test_default
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      ALLOW_PUBLISHABLE_CREATES: "true"
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  nexus-pg:
